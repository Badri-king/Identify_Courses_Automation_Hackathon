# Enable the Spark HTML Report
extent.reporter.spark.start=true

# Set the output folder and file name for the report
extent.reporter.spark.out=Report/Index.html

# (Optional) Attach screenshots to the report if a step fails
# Requires your step definitions to implement screenshot capture via Cucumber's Scenario object
extent.reporter.spark.config.theme=standard
extent.reporter.spark.base64imagesrc=true
extent.reporter.spark.config.documentTitle=Cucumber Test Report
extent.reporter.spark.config.reportName=Automation Test Results